<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Dashboard - Redesigned Layout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
	<link 
  rel="stylesheet" 
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link 
  rel="stylesheet" 
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link 
  rel="stylesheet" 
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link 
  rel="stylesheet" 
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link 
  rel="stylesheet" 
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    body {
      background-color: #1d1d5c;
      color: #fff;
    }
    /* Top bar styling */
    .top-bar {
      background-color: #d9d2d2;
      padding: 1rem;
    }
    .top-bar h1 {
      margin: 0;
    }
    .shift-down {
      margin-top: 0.75rem;
    }
    .admin-only {
      display: none;
    }
    #drop-zone-container {
      display: none;
      margin: 1rem;
    }
    .drop-zone {
      border: 2px dashed #bbb;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      color: #bbb;
    }
    .drop-zone.dragover {
      border-color: #fff;
      color: #fff;
    }
    /* Card styling */
    .order-card {
      margin-bottom: 1rem;
    }
    .order-card .card-header {
      background-color: #6c9b77;
      color: #fff;
      padding: 0.5rem 1rem;
    }
    .order-card .card-header h4 {
      margin-bottom: 0;
      font-weight: bold;
    }
    .order-card .card-body {
      background-color: #070707;
      color: #fff;
      padding: 1rem;
    }
    /* Flex helper class */
    .d-flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <!-- Admin Login Modal -->
  <div class="modal fade" id="adminLoginModal" tabindex="-1" aria-labelledby="adminLoginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content text-dark">
        <div class="modal-header">
          <h5 class="modal-title" id="adminLoginModalLabel">Admin Login</h5>
        </div>
        <div class="modal-body">
          <form id="adminLoginForm">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="loginButton">Login</button>
        </div>
      </div>
    </div>
  </div>

  <!-- View CSV Modal -->
  <div class="modal fade" id="viewCSVModal" tabindex="-1" aria-labelledby="viewCSVModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content text-dark">
        <div class="modal-header">
          <h5 class="modal-title" id="viewCSVModalLabel">CSV Files</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="csvFileList" style="max-height:400px; overflow:auto;"></div>
      </div>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar d-flex align-items-center justify-content-between gap-3">
    <!-- Left Group: Heading, dynamic station filter, status filter, admin buttons -->
    <div class="d-flex align-items-center gap-3 flex-wrap">
      <h1 class="text-black">Order Dashboard</h1>
      <!-- Station Filter Dropdown (built dynamically) -->
      <div class="dropdown">
        <button id="stationDropdownToggle" class="btn btn-dark dropdown-toggle shift-down" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          All
        </button>
        <ul class="dropdown-menu" id="stationDropdownMenu">
          <!-- We'll populate this with JavaScript -->
        </ul>
      </div>
      <!-- Status Filter Dropdown -->
      <div class="dropdown">
        <button id="statusDropdownToggle" class="btn btn-dark dropdown-toggle shift-down" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          All
        </button>
        <ul class="dropdown-menu" id="statusDropdownMenu">
          <li><a class="dropdown-item status-filter" href="#" data-status="All">All</a></li>
          <li><a class="dropdown-item status-filter" href="#" data-status="Current">Current</a></li>
          <li><a class="dropdown-item status-filter" href="#" data-status="Complete">Complete</a></li>
        </ul>
      </div>
      <!-- Admin Buttons -->
      <button id="insert-csv-btn" class="btn btn-dark shift-down admin-only">Insert +</button>
      <button id="view-csv-btn" class="btn btn-secondary shift-down admin-only">View CSV</button>
    </div>
    <!-- Right side: Real-Time Clock (Central Time) -->
    <div id="clock" class="text-black"></div>
  </div>

  <!-- Drop Zone Container -->
  <div id="drop-zone-container" class="container">
    <div id="drop-zone" class="drop-zone">
      Drag & Drop your csv file here or click to select.
      <input type="file" id="file-input" accept=".csv" style="display: none;">
    </div>
  </div>

  <!-- Container for Order Cards -->
  <div class="container mt-4">
    <div class="row row-cols-1 row-cols-md-3 g-4" id="ordersRow">
      <!-- If no data is available, we'll add a placeholder here -->
    </div>
  </div>

  <!-- jQuery, Papa Parse, and Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script>
    // Global filter variables
    let selectedStation = 'All';
    let selectedStatus = 'All';
    let userRole = '';

    // Real-time clock (Central Time)
    function updateClock() {
      const options = {
        timeZone: 'America/Chicago',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      };
      const timeString = new Intl.DateTimeFormat('en-US', options).format(new Date());
      document.getElementById('clock').textContent = `Central Time: ${timeString}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // If no CSV data, show placeholder
    function displayEmptyOrders() {
      $('#ordersRow').empty();
      $('#ordersRow').append(`
        <div class="col text-center">
          <p>No CSV files or data found. Please upload a file.</p>
        </div>
      `);
    }

    $(document).ready(function(){
      // Admin Login Modal
      const adminModal = new bootstrap.Modal(document.getElementById('adminLoginModal'), {
        backdrop: 'static',
        keyboard: false
      });
      adminModal.show();

      // Login handler
      $('#loginButton').click(function(){
        const username = $('#username').val();
        const password = $('#password').val();
        $.post('/login', { username, password }, function(response){
          if(response.success) {
            userRole = response.role;
            adminModal.hide();
            if(userRole === 'admin') {
              // Show admin elements
              $('.admin-only').show();
              $('#drop-zone-container').show();
            }
          } else {
            alert(response.message || 'Invalid credentials!');
          }
        });
      });

      // Toggle CSV drop zone
      $('#insert-csv-btn').click(function(){
        if(userRole === 'admin') {
          $('#drop-zone-container').slideToggle();
        } else {
          alert("You don't have permission to upload files.");
        }
      });

      // Drag & drop or file selection
      const dropZone = document.getElementById('drop-zone');
      const fileInput = document.getElementById('file-input');

      dropZone.addEventListener('click', function(){
        if(userRole === 'admin') {
          fileInput.click();
        } else {
          alert("You don't have permission to upload files.");
        }
      });

      fileInput.addEventListener('change', function(e){
        if(e.target.files.length) {
          handleFile(e.target.files[0]);
        }
      });

      dropZone.addEventListener('dragover', function(e){
        e.preventDefault();
        dropZone.classList.add('dragover');
      });
      dropZone.addEventListener('dragleave', function(e){
        e.preventDefault();
        dropZone.classList.remove('dragover');
      });
      dropZone.addEventListener('drop', function(e){
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const files = e.dataTransfer.files;
        if(files.length) {
          handleFile(files[0]);
        }
      });

      function handleFile(file) {
        if(userRole !== 'admin') {
          alert("You don't have permission to upload files.");
          return;
        }
        if(file.type !== "text/csv") {
          alert("Please upload a valid CSV file.");
          return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
          const csvData = e.target.result;
          const fileName = file.name;
          // Upload CSV to server
          $.ajax({
            url: '/upload',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ csvData, fileName }),
            success: function(response) {
              if(response.success) {
                loadOrdersFromCSV(csvData);
                $('#drop-zone-container').slideUp();
              } else {
                alert(response.message || 'Upload failed.');
              }
            }
          });
        };
        reader.readAsText(file);
      }

      // View CSV Modal
      $('#view-csv-btn').click(function(){
        $.get('/orders', function(data){
          let html = "";
          if(data.ordersFiles && data.ordersFiles.length > 0) {
            html += "<ul class='list-group'>";
            data.ordersFiles.forEach(file => {
              html += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  ${file.fileName}
                  <button class="btn btn-sm btn-danger delete-csv-btn" data-file="${encodeURIComponent(file.fileName)}">Delete</button>
                </li>
              `;
            });
            html += "</ul>";
          } else {
            html = "No CSV files uploaded.";
          }
          $('#csvFileList').html(html);
          const viewModal = new bootstrap.Modal(document.getElementById('viewCSVModal'), {});
          viewModal.show();
        });
      });

      // Delete CSV
      $(document).on('click', '.delete-csv-btn', function(){
        const fileName = decodeURIComponent($(this).data('file'));
        if(confirm("Are you sure you want to delete " + fileName + "?")){
          $.ajax({
            url: '/delete',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ fileName }),
            success: function(response){
              if(response.success){
                alert("Deleted " + fileName);
                // Refresh the CSV list
                $('#view-csv-btn').click();
                // Refresh the main data as well
                $.get('/orders', function(data){
                  if(data.ordersFiles && data.ordersFiles.length > 0) {
                    let latestFile = data.ordersFiles.reduce((prev, current) =>
                      (prev.timestamp > current.timestamp) ? prev : current
                    );
                    loadOrdersFromCSV(latestFile.csvData);
                  } else {
                    displayEmptyOrders();
                  }
                });
              } else {
                alert(response.message || "Failed to delete file.");
              }
            }
          });
        }
      });

      // Poll for updates every 5s
      setInterval(function(){
        $.get('/orders', function(data){
          if(data.ordersFiles && data.ordersFiles.length > 0) {
            let latestFile = data.ordersFiles.reduce((prev, current) =>
              (prev.timestamp > current.timestamp) ? prev : current
            );
            loadOrdersFromCSV(latestFile.csvData);
          } else {
            displayEmptyOrders();
          }
        });
      }, 5000);

      // Build dynamic station dropdown from "Prep Area"
      function buildStationDropdown(stationSet) {
        const stationDropdownMenu = document.getElementById('stationDropdownMenu');
        stationDropdownMenu.innerHTML = '';

        // Always include "All"
        let liAll = document.createElement('li');
        liAll.innerHTML = `<a class="dropdown-item station-filter" href="#" data-station="All">All</a>`;
        stationDropdownMenu.appendChild(liAll);

        // Add each distinct station
        stationSet.forEach(station => {
          let li = document.createElement('li');
          li.innerHTML = `<a class="dropdown-item station-filter" href="#" data-station="${station}">${station}</a>`;
          stationDropdownMenu.appendChild(li);
        });

        // If current selectedStation isn't in the set, revert to All
        if(!stationSet.has(selectedStation) && selectedStation !== 'All') {
          selectedStation = 'All';
          document.getElementById('stationDropdownToggle').textContent = 'All';
        }
      }

      // Load CSV data, skip rows with Qty=0, build station filter, and display
      function loadOrdersFromCSV(csvData){
        $('#ordersRow').empty();
        const parsed = Papa.parse(csvData, { header: true, skipEmptyLines: true });
        if(!parsed.data || parsed.data.length === 0) {
          displayEmptyOrders();
          return;
        }

        let cardIndex = 0;
        let stationSet = new Set();

        parsed.data.forEach(row => {
          // Skip rows if Qty=0
          const quantity = parseFloat(row["Qty"]) || 0;
          if(quantity === 0) return;

          // Use "Prep Area" as station for filter, ignoring .Package Title
          let station = (row["Prep Area"] || '').trim();
          if(station && station !== '.Package Title') {
            stationSet.add(station);
          }

          // Extract relevant fields for the new layout
          const itemName       = row["Item Name"] || "";
          const itemUnit       = row["Item Unit"] || "";
          const eventDetails   = row["Event Details Description"] || ""; // Modifiers
          // We'll rename "Prep Area" to "Packaging" in the display
          const packaging      = station || "";
          const siteName       = row["Site Name"] || "";
          const departure      = row["Departure"] || "";
          const deliveryTime   = row["Delivery Time"] || "";
          const status         = row["Status"] || "Pending";

          // Build the card per your design:
          // - Top: itemName (bold, large), itemUnit beneath, Qty top-right
          // - Middle: "Modifers" + "Packaging"
          // - Bottom: site, departure, delivery time + "Mark Complete"
          const cardHTML = `
            <div class="col" data-index="${cardIndex}" data-station="${station}" data-status="${status}">
              <div class="card order-card">
                <!-- Card Header -->
                <div class="card-header">
                  <div class="d-flex-between">
                    <div>
                      <h6 class="mb-0 fw-bold">${itemName}</h6>
                      <small>${itemUnit}</small>
                    </div>
                    <div>
                      <strong>Qty: ${quantity}</strong>
                    </div>
                  </div>
                </div>
                <!-- Card Body -->
                <div class="card-body">
                  <p><strong><i class="bi bi-arrow-right-circle"> ${eventDetails}</i></strong></p>
                  <p><strong>Packaging:</strong> ${packaging}</p>
                  <div class="d-flex-between">
                    <div>
                      <strong><i class="bi bi-geo-alt"> ${siteName}</i></strong> <br>
                      <strong><i class="bi bi-box-arrow-up"> ${departure}</i></strong> <br>
                      <strong><i class="bi bi-truck">  ${deliveryTime}</i></strong> 
                    </div>
                    <button class="btn btn-sm btn-success mark-complete-btn">Mark Complete</button>
                  </div>
                </div>
              </div>
            </div>
          `;
          $('#ordersRow').append(cardHTML);
          cardIndex++;
        });

        // Build station dropdown from all distinct station values
        buildStationDropdown(stationSet);

        // Apply the currently selected filters
        applyFilters();
      }

      // Mark complete -> update status to "Complete"
      $(document).on('click', '.mark-complete-btn', function(){
        const col = $(this).closest('.col');
        const orderIndex = col.data('index');
        $.ajax({
          url: '/updateStatus',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({ orderIndex, newStatus: "Complete" }),
          success: function(response){
            if(response.success){
              $.get('/orders', function(data){
                if(data.ordersFiles && data.ordersFiles.length > 0) {
                  let latestFile = data.ordersFiles.reduce((prev, current)=>
                    (prev.timestamp > current.timestamp) ? prev : current
                  );
                  loadOrdersFromCSV(latestFile.csvData);
                } else {
                  displayEmptyOrders();
                }
              });
            } else {
              alert(response.message || "Failed to update status.");
            }
          }
        });
      });

      // Station filter
      $(document).on('click', '.station-filter', function(e){
        e.preventDefault();
        selectedStation = $(this).data('station');
        document.getElementById('stationDropdownToggle').textContent = selectedStation;
        applyFilters();
      });

      // Status filter
      $(document).on('click', '.status-filter', function(e){
        e.preventDefault();
        selectedStatus = $(this).data('status');
        document.getElementById('statusDropdownToggle').textContent = selectedStatus;
        applyFilters();
      });

      // Apply filters
      function applyFilters(){
        $('#ordersRow .col').each(function(){
          const cardStation = $(this).data('station');
          const cardStatus  = $(this).data('status');
          let show = true;

          // Filter by station
          if(selectedStation !== 'All' && cardStation !== selectedStation) {
            show = false;
          }
          // Filter by status
          if(selectedStatus !== 'All') {
            if(selectedStatus === 'Current') {
              if(!(cardStatus === 'Pending' || cardStatus === 'In-progress')) {
                show = false;
              }
            } else if(selectedStatus === 'Complete') {
              if(cardStatus !== 'Complete') {
                show = false;
              }
            }
          }
          $(this).toggle(show);
        });
      }
    });
  </script>
</body>
</html>
